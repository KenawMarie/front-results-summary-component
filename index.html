<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Results summary component</title>  
</head>
<body>
  <main class="container">
    <div class="result">
      <h1>Your Result</h1>
      <div class="outer">
        <div class="number">76</div>
        <div class="total">of 100</div>
      </div>
      <h2>Great</h2>
      <p>You scored higher than 65% of the people who have taken these tests.</p>
    </div>
    <div class="summary">
      <h2>Summary</h2>
      <div class="reaction">
        <div>
          <img src="./assets/images/icon-reaction.svg" alt="icon reaction">
          <p>Reaction</p>
        </div>
        <div><span class="black">80</span> <span class="grey">/ 100</span></div>
      </div>
      <div class="memory">
        <div>
          <img src="./assets/images/icon-memory.svg" alt="icon memory">
          <p>Memory</p>
        </div>
        <div><span class="black">92</span> <span class="grey">/ 100</span></div>
      </div>
      <div class="verbal">
        <div>
          <img src="./assets/images/icon-verbal.svg" alt="icon verbal">
          <p>Verbal</p>
        </div>
        <div><span class="black">61</span> <span class="grey">/ 100</span></div>
      </div>
      <div class="visual">
        <div>
          <img src="./assets/images/icon-visual.svg" alt="icon visual">
          <p>Visual</p>
        </div>
        <div><span class="black">73</span> <span class="grey">/ 100</span></div>
      </div>
      <button class="btn">Continue</button>
    </div>
  </main>

      <p>Coded by <a href="#">Kenaw Marie</a>.</p>
    </div>
  </footer> -->
</body>
</html>
